name: Validate
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest aiohttp voluptuous
      - run: python -m compileall -q custom_components tests
      - run: pytest -q
      - run: python -m json.tool custom_components/survng/manifest.json >/dev/null
      - run: python -m json.tool custom_components/survng/strings.json >/dev/null
      - run: python -m json.tool custom_components/survng/translations/en.json >/dev/null
