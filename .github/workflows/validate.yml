name: Validate
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python: "3.13"
            homeassistant: "2025.12.5"
            turbojpeg: "1.8.0"
            av: "16.0.1"
          - python: "3.14"
            homeassistant: "2026.9.2"
            turbojpeg: "1.8.3"
            av: "17.0.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install homeassistant==${{ matrix.homeassistant }} PyTurboJPEG==${{ matrix.turbojpeg }} av==${{ matrix.av }} numpy==2.3.2 pytest ruff
      - run: ruff check custom_components tests
      - run: python -m compileall -q custom_components tests
      - run: |
          python - <<'PY'
          modules = (
              "custom_components.survng",
              "custom_components.survng.api",
              "custom_components.survng.binary_sensor",
              "custom_components.survng.camera",
              "custom_components.survng.config_flow",
              "custom_components.survng.coordinator",
              "custom_components.survng.diagnostics",
              "custom_components.survng.event",
              "custom_components.survng.mqtt",
              "custom_components.survng.repairs",
              "custom_components.survng.sensor",
              "custom_components.survng.switch",
          )
          for module in modules:
              __import__(module)
          PY
      - run: pytest -q
      - run: python -m json.tool custom_components/survng/manifest.json >/dev/null
      - run: python -m json.tool custom_components/survng/strings.json >/dev/null
      - run: python -m json.tool custom_components/survng/translations/en.json >/dev/null
